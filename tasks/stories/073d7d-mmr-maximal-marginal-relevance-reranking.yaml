description: "Implement Maximal Marginal Relevance reranking. MMR balances relevance to query with diversity among results: score = lambda * sim(doc, query) - (1-lambda) * max(sim(doc, selected_docs)). Uses cosine similarity on embeddings. lambda parameter controls relevance vs diversity tradeoff (default 0.5). Port from graphiti_core/search/search_utils.py mmr_reranker()."
