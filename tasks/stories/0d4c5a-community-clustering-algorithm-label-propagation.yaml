description: "Implement community clustering using label propagation algorithm. Port from graphiti_core/utils/maintenance/graph_data_operations.py. For each entity node: find its neighbors via RELATES_TO, determine which community its neighbors mostly belong to, assign entity to that community (or create new one). Uses mode-finding: most common community among neighbors wins. Generate community name and summary via LLM. This is the 'intelligence' behind automatic entity grouping."
