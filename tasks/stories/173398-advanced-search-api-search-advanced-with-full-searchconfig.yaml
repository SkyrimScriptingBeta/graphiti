description: "Expose the full search_advanced() method on the Graphiti class accepting a complete SearchConfig. Allows caller to configure which search methods (BM25, cosine, BFS), which reranker (RRF, cross-encoder, MMR, node_distance, episode_mentions), min scores, BFS depth, MMR lambda. Returns SearchResults with edges, nodes, episodes, communities, each with their reranker scores. Pre-built recipe functions: edge_hybrid_search_rrf(), combined_hybrid_search_rrf(), combined_hybrid_search_cross_encoder()."
