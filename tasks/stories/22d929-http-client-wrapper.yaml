description: "Thin wrapper around cpp-httplib for HTTPS POST with JSON bodies. Interface: HttpResponse post_json(host, path, headers, json_body) returning status code + response body string. SSL/TLS via openssl3. Timeout configuration. This is the only network I/O layer. Used by OpenAI LLM client and embedder. Keep it simple, no async needed."
