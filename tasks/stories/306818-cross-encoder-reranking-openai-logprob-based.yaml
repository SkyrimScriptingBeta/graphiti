title: Cross-encoder reranking (OpenAI logprob-based)
type: story
status: not_ready
parent: 38334c
slug: 306818
description: Port OpenAI logprob-based cross-encoder reranker from graphiti_core/search/search_utils.py and the OpenAI reranker client. For each candidate passage, send a prompt asking 'Is this relevant to the query? Answer True or False', extract logprobs for True/False tokens, score by P(True). Requires OpenAI chat completions with logprobs enabled. Sort results by score descending. This is the highest quality reranker but most expensive (one LLM call per candidate).
