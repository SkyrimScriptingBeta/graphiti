description: "Implement add_episode_bulk() for batch episode ingestion. Takes vector<RawEpisode>, processes all episodes together for efficiency. Extract nodes/edges for all episodes in memory, cross-deduplicate within the batch, single graph write. Port from graphiti_core/utils/bulk_utils.py. Includes UnionFind for UUID canonicalization, compress_uuid_map, resolve_edge_pointers. NOTE: Python bulk mode skips edge invalidation and community updates for speed."
