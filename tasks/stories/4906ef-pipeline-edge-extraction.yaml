description: "Port extract_edges() from graphiti_core/utils/maintenance/edge_operations.py. Takes episode content + extracted nodes + previous episodes + optional edge types. Calls LLM with edge extraction prompt, parses ExtractedEdges response. Creates EntityEdge objects. Resolves source_entity_name/target_entity_name to node UUIDs from the extracted node list. Sets valid_at/invalid_at from LLM response (ISO8601). Generates fact embeddings via embedder. Integration test: given extracted nodes [Alice, Acme Corp], extract edges from 'Alice works at Acme Corp', verify WORKS_AT edge with correct fact."
