description: Implement a callback-based embedder that delegates to a user-provided function. Constructor takes std::function<vector<float>(string)>. Allows users to bring their own embedding logic without implementing the full interface. Useful for wrapping existing embedding infrastructure (ONNX, custom models, etc). Batch implementation just loops over single calls (user can optimize internally).
