description: "Comprehensive end-to-end integration tests that exercise the full library as a consumer would use it. Test scenarios: (1) Single episode ingestion and retrieval, (2) Multi-episode conversation with entity dedup across episodes, (3) Temporal awareness: add 'Alice works at Acme', then 'Alice left Acme for Google', search should return current fact with old fact invalidated, (4) Group ID isolation: episodes in different groups don't cross-contaminate, (5) On-disk Kuzu persistence: create, close, reopen, verify data survives. These tests use real OpenAI API calls (gpt-4.1-mini) and validate the complete pipeline."
