description: "Create MENTIONS relationships (EpisodicEdge) linking the episode to each entity node it references. For each entity node extracted from an episode, create an EpisodicEdge with the Kuzu query: MATCH (episode:Episodic {uuid}), (node:Entity {uuid}) MERGE (episode)-[e:MENTIONS {uuid}]->(node). Straightforward but essential for the episode-to-entity graph structure that powers BFS search and episode retrieval."
