description: "Implement edge and node search via Kuzu FTS and vector similarity. Edge BM25: CALL QUERY_FTS_INDEX('RelatesToNode_', 'edge_name_and_fact', query, TOP := limit), then join back to source/target Entity nodes via RELATES_TO. Edge cosine: MATCH (n:Entity)-[:RELATES_TO]->(e:RelatesToNode_)-[:RELATES_TO]->(m:Entity) WITH array_cosine_similarity(e.fact_embedding, CAST(vector AS FLOAT[1024])) AS score. Node BM25: CALL QUERY_FTS_INDEX('Entity', 'node_name_and_summary', query). Node cosine: array_cosine_similarity on name_embedding. Port queries from graphiti_core/driver/kuzu/operations/search_ops.py. Integration test: add episodes, search by text and by semantic similarity, verify relevant results returned."
