description: "Wire together the full add_episode pipeline in the Graphiti class. Flow: (1) validate config, (2) retrieve previous episodes from Kuzu for LLM context, (3) create EpisodicNode, (4) extract entities via LLM, (5) resolve/deduplicate nodes against graph, (6) extract edges via LLM, (7) resolve/deduplicate edges, (8) enrich node summaries, (9) generate embeddings for nodes and edges, (10) persist everything to Kuzu (nodes, edges, episode, episodic edges). Port from graphiti_core/graphiti.py add_episode method. Integration test: full pipeline with real OpenAI calls + in-memory Kuzu."
