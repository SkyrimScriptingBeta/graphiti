description: "Add community search via cosine similarity on community name embeddings. Query: MATCH (n:Community) WITH n, array_cosine_similarity(n.name_embedding, CAST(vector AS FLOAT[1024])) AS score WHERE score > min_score. Also BM25 via QUERY_FTS_INDEX on community name. Depends on Phase 3 community support being implemented first."
