description: "HTTP POST to https://api.openai.com/v1/embeddings. Request: {model: 'text-embedding-3-small', input: 'text' or ['text1','text2',...]}. Parse data[0].embedding, truncate to embedding_dim (default 1024). Single embed: create(string) -> vector<float>. Batch: create_batch(vector<string>) -> vector<vector<float>>. Integration test: embed 'hello world', verify dim=1024, values are floats, L2 norm approximately 1. Batch test with 3 texts."
