description: "Build the library for WASM target via Emscripten + xmake. Kuzu already supports WASM (user confirmed). HTTP calls are the challenge: cpp-httplib won't work in WASM, need emscripten_fetch or a callback-based HTTP interface. May require conditional compilation: native builds use cpp-httplib, WASM uses fetch API or user-provided callback. Consider: in WASM, LLM calls might go through the host JS environment. The embedder may need to be callback-based (ONNX.js or user-provided)."
