description: "Define abstract GraphDriver interface for database backends. Virtual methods for all CRUD operations, search operations, schema setup. KuzuDriver becomes one implementation. This is already partially implicit in Phase 1 design but this story makes it explicit with a virtual base class. Enables future Neo4j or other backends without changing the rest of the library. NOTE: Low priority since we only care about Kuzu, but good software design."
