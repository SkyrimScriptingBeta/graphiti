description: "HTTP POST to https://api.openai.com/v1/chat/completions. JSON mode: response_format={'type':'json_object'}. Schema injected as text into user message: 'Respond with a JSON object in the following format: {schema}'. Parse choices[0].message.content as JSON. Retry loop: up to 2 retries on JSON parse failure, appending error context as new user message. Two model sizes: model (gpt-4.1-mini) and small_model (gpt-4.1-nano). Headers: Authorization Bearer, Content-Type application/json. Port retry logic from graphiti_core/llm_client/openai_base_client.py. Integration test: send a real chat completion, verify structured output parses. Unit test: verify request construction, retry behavior with mock responses."
