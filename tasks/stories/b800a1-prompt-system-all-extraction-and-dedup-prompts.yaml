description: "Direct port of all prompt builder functions from graphiti_core/prompts/. Each function takes context parameters and returns vector<Message> (system + user messages). Functions: extract_message_prompt (entity extraction from dialogue), extract_text_prompt (from plain text), extract_json_prompt (from JSON data), extract_edges_prompt (relationship extraction), dedupe_node_prompt (single node dedup), dedupe_nodes_prompt (batch node dedup), resolve_edge_prompt (edge dedup/contradiction), extract_summary_prompt (entity summary), extract_summaries_batch_prompt (batch summaries). Use std::format (C++23) for string interpolation. Include multilingual instruction appendix. Unit tests: verify each prompt returns correct roles, contains expected content fragments (XML tags, entity type placeholders, etc). No LLM calls in unit tests."
