description: "Define all graph element structs in include/graphiti/types.h with nlohmann JSON serialization in src/types.cpp. Types: EntityNode (uuid, name, group_id, labels[], created_at, name_embedding[], summary, attributes), EpisodicNode (uuid, name, group_id, created_at, source, source_description, content, valid_at, entity_edges[]), CommunityNode, SagaNode, EntityEdge (uuid, group_id, source/target_node_uuid, name, fact, fact_embedding[], episodes[], created_at, expired_at, valid_at, invalid_at, attributes), EpisodicEdge, CommunityEdge, HasEpisodeEdge, NextEpisodeEdge. EpisodeType enum (message, json, text). TimePoint = std::chrono::system_clock::time_point. Attributes as nlohmann::json. All types must round-trip through JSON (serialize then deserialize = identical). Unit tests for every type."
