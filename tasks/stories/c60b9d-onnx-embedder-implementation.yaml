description: "Implement an ONNX Runtime-based embedder that runs embedding models locally without network calls. This is critical for the Skykit use case where ONNX is already compiled into the binary. The user already has ONNX embedding working in their C++ toolchain. This story integrates that pattern into Graphiti's EmbedderClient interface. May require ONNX Runtime as an optional xmake dependency. NOTE: Scope may depend on how user's existing ONNX integration works - may be as simple as a callback wrapper."
