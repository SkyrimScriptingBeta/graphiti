description: "Port resolve_extracted_nodes() from node_operations.py. For each extracted node: (1) search existing graph nodes by name via FTS + vector similarity, (2) call LLM with dedupe prompt comparing new vs existing nodes, (3) if duplicate found, map new UUID to existing UUID. Returns deduplicated node list + uuid_map (old->canonical). Uses uuid_map to update all edge source/target references. Critical for preventing duplicate entity accumulation. Integration test: add episode with 'Alice', then add another with 'Alice Smith' referring to same person, verify dedup merges them."
