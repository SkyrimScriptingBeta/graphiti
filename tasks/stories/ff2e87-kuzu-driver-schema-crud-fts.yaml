description: "Wrap Kuzu C++ API (kuzu::Database, kuzu::Connection). Setup schema on construction: Entity, Episodic, Community, RelatesToNode_, Saga node tables + RELATES_TO, MENTIONS, HAS_MEMBER, HAS_EPISODE, NEXT_EPISODE rel tables. CRITICAL: Kuzu uses intermediate RelatesToNode_ for edges (no FTS on edge properties). All entity edge CRUD uses triple pattern: (Entity)-[:RELATES_TO]->(RelatesToNode_)-[:RELATES_TO]->(Entity). Create FTS indices on Entity(name,summary), Episodic(content,source,source_description), RelatesToNode_(name,fact), Community(name). Full CRUD for EntityNode, EpisodicNode, EntityEdge. Individual SET statements (no property maps). Attributes stored as JSON strings. Port queries from graphiti_core/driver/kuzu/operations/. Unit tests with :memory: Kuzu DB."
